name: Build Only

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to build the latest commit from.'
        required: true
        default: 'develop'

permissions:
  contents: read
  packages: write

jobs:
  resolve-commit:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    steps:
      - name: Checkout the specified branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Resolve exact commit
        id: resolve
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved commit is not a full git SHA: $commit_sha" >&2
            exit 1
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-commit
    uses: ./.github/workflows/reusable-build.yaml
    with:
      commit_sha: ${{ needs.resolve-commit.outputs.commit_sha }}
