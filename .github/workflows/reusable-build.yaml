name: Reusable Build BE

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'The tag for the Docker image (e.g., the git SHA)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # This job needs `write` permission to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up JDK 21 and Maven
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Verify and build JAR with Maven Wrapper
        run: ./mvnw -B verify
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/almonium-platform/almonium-be:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report application and container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/almonium-platform/almonium-be:${{ inputs.image_tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Enforce container base-image vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/almonium-platform/almonium-be:${{ inputs.image_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
