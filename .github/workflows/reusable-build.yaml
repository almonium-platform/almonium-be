name: Reusable Build BE

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'The exact git commit to check out, build, and use as the image tag.'
        required: true
        type: string
    outputs:
      image_digest:
        description: 'The immutable digest of the pushed image.'
        value: ${{ jobs.build.outputs.image_digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build_image.outputs.digest }}
    permissions:
      contents: read
      packages: write # This job needs `write` permission to GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify checked-out commit
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_commit_sha="$(git rev-parse HEAD)"
          test "$actual_commit_sha" = "$EXPECTED_COMMIT_SHA"
      - name: Reject changes to existing Liquibase patches
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            changed_changelogs="$(git diff --name-only --diff-filter=MDCR HEAD^ HEAD -- src/main/resources/db/changelog/changes/patches)"
            if test -n "$changed_changelogs"; then
              echo "Existing Liquibase patch files are immutable. Add a new patch instead:"
              echo "$changed_changelogs"
              exit 1
            fi
          fi
      - name: Set up JDK 25 and Maven
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Verify and build JAR with Maven Wrapper
        run: ./mvnw -B verify
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/almonium-platform/almonium-be:${{ inputs.commit_sha }}
          labels: org.opencontainers.image.revision=${{ inputs.commit_sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record built artifact
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          {
            echo "### Built backend image"
            echo
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Tag: \`ghcr.io/almonium-platform/almonium-be:$COMMIT_SHA\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Deploy reference: \`ghcr.io/almonium-platform/almonium-be@$IMAGE_DIGEST\`"
            echo "- Evidence: BuildKit SBOM and max-mode provenance attestations attached to the image index"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report application and container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/almonium-platform/almonium-be@${{ steps.build_image.outputs.digest }}
          trivy-config: .trivy.yaml
          format: table
          exit-code: '0'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Enforce container base-image vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/almonium-platform/almonium-be@${{ steps.build_image.outputs.digest }}
          trivy-config: .trivy.yaml
          format: table
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
