name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'OPTIONAL: Re-deploy an existing immutable image digest.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  run-pipeline:
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment_name: staging
      source_branch: develop
      image_digest: ${{ inputs.image_digest }}
    secrets: inherit
