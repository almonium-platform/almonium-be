name: Reusable Deploy BE

on:
    workflow_call:
        inputs:
            environment_name:
                required: true
                type: string
            image_digest:
                required: true
                type: string
        outputs:
            deployed_image_digest:
                description: 'The immutable image digest passed to Ansible.'
                value: ${{ jobs.deploy.outputs.deployed_image_digest }}
        secrets:
            INFRA_REPO_CHECKOUT_KEY:
                required: true
            CLOUD_KEY:
                required: true
            CLOUD_KNOWN_HOSTS:
                required: true
            ANSIBLE_VAULT_PASSWORD_ALL:
                required: true
            ANSIBLE_VAULT_PASSWORD_ALMONIUM_SHARED:
                required: true
            ANSIBLE_VAULT_PASSWORD_ALMONIUM_PROD:
                required: true
            ANSIBLE_VAULT_PASSWORD_ALMONIUM_STAGING:
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment_name }}
        concurrency:
            group: deploy-almonium-be-${{ inputs.environment_name }}
            cancel-in-progress: false
        outputs:
            deployed_image_digest: ${{ inputs.image_digest }}
        permissions:
            packages: read
        steps:
            - name: Validate immutable image digest
              shell: bash
              env:
                  IMAGE_DIGEST: ${{ inputs.image_digest }}
              run: |
                  set -euo pipefail
                  if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                    echo "image_digest must have the form sha256:<64 lowercase hex characters>" >&2
                    exit 1
                  fi

            - name: Checkout almonium-infra repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  repository: almonium-platform/almonium-infra
                  path: almonium-infra
                  ssh-key: ${{ secrets.INFRA_REPO_CHECKOUT_KEY }}

            -   name: Prepare vault password files
                shell: bash
                run: |
                    set -euo pipefail
                    
                    mkdir -p ~/.ansible
                    umask 077
                    
                    printf "%s" "${{ secrets.ANSIBLE_VAULT_PASSWORD_ALL }}" > ~/.ansible/vault-all
                    printf "%s" "${{ secrets.ANSIBLE_VAULT_PASSWORD_ALMONIUM_SHARED }}" > ~/.ansible/vault-almonium-shared
                    
                    if [ "${{ inputs.environment_name }}" = "prod" ]; then
                      printf "%s" "${{ secrets.ANSIBLE_VAULT_PASSWORD_ALMONIUM_PROD }}" > ~/.ansible/vault-almonium-env
                      echo "ALMONIUM_ENV_VAULT_ID=almonium_prod" >> "$GITHUB_ENV"
                    else
                      printf "%s" "${{ secrets.ANSIBLE_VAULT_PASSWORD_ALMONIUM_STAGING }}" > ~/.ansible/vault-almonium-env
                      echo "ALMONIUM_ENV_VAULT_ID=almonium_staging" >> "$GITHUB_ENV"
                    fi

            -   name: Run Ansible Playbook
                uses: dawidd6/action-ansible-playbook@93764e7048f4dd16117d134dadb4b36e8ee73227 # v4
                with:
                    playbook: playbook-deploy-almonium-be.yaml
                    directory: almonium-infra/ansible
                    key: ${{ secrets.CLOUD_KEY }}
                    known_hosts: ${{ secrets.CLOUD_KNOWN_HOSTS }}
                    options: |
                        -i inventory/hosts.ini
                        --limit almonium
                        --vault-id all@/home/runner/.ansible/vault-all
                        --vault-id almonium_shared@/home/runner/.ansible/vault-almonium-shared
                        --vault-id ${{ env.ALMONIUM_ENV_VAULT_ID }}@/home/runner/.ansible/vault-almonium-env
                        --extra-vars deploy_environment=${{ inputs.environment_name }}
                        --extra-vars deploy_image_digest=${{ inputs.image_digest }}
                        --extra-vars deploy_gh_actor=${{ github.actor }}
                        --extra-vars deploy_gh_token=${{ secrets.GITHUB_TOKEN }}

            - name: Record deployed artifact
              shell: bash
              env:
                  DEPLOY_ENVIRONMENT: ${{ inputs.environment_name }}
                  IMAGE_DIGEST: ${{ inputs.image_digest }}
              run: |
                  {
                    echo "### Deployed backend image"
                    echo
                    echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
                    echo "- Digest: \`$IMAGE_DIGEST\`"
                    echo "- Reference: \`ghcr.io/almonium-platform/almonium-be@$IMAGE_DIGEST\`"
                  } >> "$GITHUB_STEP_SUMMARY"
