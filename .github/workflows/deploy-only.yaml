name: Deploy Only

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'The immutable image digest (sha256:...).'
        required: true
      environment:
        description: 'The environment to deploy to.'
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: write # a prod deploy moves main to the commit production runs
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      environment_name: ${{ inputs.environment }}
      image_digest: ${{ inputs.image_digest }}
    secrets: inherit
