name: Reusable Build and Deploy Orchestrator

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      image_digest:
        required: false
        type: string
    outputs:
      deployed_image_digest:
        description: 'The immutable image digest passed to deployment.'
        value: ${{ jobs.deploy.outputs.deployed_image_digest }}
    secrets:
      INFRA_REPO_CHECKOUT_KEY:
        required: true
      CLOUD_KEY:
        required: true
      ANSIBLE_VAULT_PASSWORD_ALL:
        required: true
      ANSIBLE_VAULT_PASSWORD_ALMONIUM_SHARED:
        required: true
      ANSIBLE_VAULT_PASSWORD_ALMONIUM_PROD:
        required: true
      ANSIBLE_VAULT_PASSWORD_ALMONIUM_STAGING:
        required: true

permissions:
  contents: read
  packages: write

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      image_digest: ${{ steps.resolve.outputs.image_digest }}
      build_needed: ${{ steps.resolve.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v6
        if: inputs.image_digest == ''
        with:
          ref: ${{ inputs.source_branch }}
          persist-credentials: false

      - id: resolve
        env:
          REQUESTED_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_IMAGE_DIGEST" ]]; then
            if [[ ! "$REQUESTED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "image_digest must have the form sha256:<64 lowercase hex characters>" >&2
              exit 1
            fi
            echo "commit_sha=" >> "$GITHUB_OUTPUT"
            echo "image_digest=$REQUESTED_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          else
            commit_sha="$(git rev-parse HEAD)"
            if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Resolved commit is not a full git SHA: $commit_sha" >&2
              exit 1
            fi
            echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
            echo "image_digest=" >> "$GITHUB_OUTPUT"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-image
    if: needs.resolve-image.outputs.build_needed == 'true'
    uses: ./.github/workflows/reusable-build.yaml
    with:
      commit_sha: ${{ needs.resolve-image.outputs.commit_sha }}

  deploy:
    needs: [resolve-image, build]
    if: needs.resolve-image.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      environment_name: ${{ inputs.environment_name }}
      image_digest: ${{ needs.resolve-image.outputs.image_digest || needs.build.outputs.image_digest }}
    secrets:
      INFRA_REPO_CHECKOUT_KEY: ${{ secrets.INFRA_REPO_CHECKOUT_KEY }}
      CLOUD_KEY: ${{ secrets.CLOUD_KEY }}
      ANSIBLE_VAULT_PASSWORD_ALL: ${{ secrets.ANSIBLE_VAULT_PASSWORD_ALL }}
      ANSIBLE_VAULT_PASSWORD_ALMONIUM_SHARED: ${{ secrets.ANSIBLE_VAULT_PASSWORD_ALMONIUM_SHARED }}
      ANSIBLE_VAULT_PASSWORD_ALMONIUM_PROD: ${{ secrets.ANSIBLE_VAULT_PASSWORD_ALMONIUM_PROD }}
      ANSIBLE_VAULT_PASSWORD_ALMONIUM_STAGING: ${{ secrets.ANSIBLE_VAULT_PASSWORD_ALMONIUM_STAGING }}
