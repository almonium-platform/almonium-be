databaseChangeLog:
  - changeSet:
      id: add-pending-email-changes
      author: codex
      changes:
        - createTable:
            tableName: pending_email_change
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: pending_email_change
            baseColumnNames: user_id
            referencedTableName: user_core
            referencedColumnNames: id
            constraintName: fk_pending_email_change_user
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: pending_email_change
