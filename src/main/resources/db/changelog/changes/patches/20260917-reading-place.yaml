databaseChangeLog:
  - changeSet:
      id: 20260917-reading-place
      author: claude
      comment: >-
        The place a reader stopped at, beside the percentage (mobile design 4a, "12% · chapter 3 of 24").
        learner_book_progress.current_chapter is the chapter being read, as the processor numbers it; a client that
        only sends the percentage leaves it as it was. book.chapter_count is how many chapters the processor
        published, sent with the publication; null for an edition published before it was.
      changes:
        - addColumn:
            tableName: learner_book_progress
            columns:
              - column:
                  name: current_chapter
                  type: int
        - addColumn:
            tableName: book
            columns:
              - column:
                  name: chapter_count
                  type: int
