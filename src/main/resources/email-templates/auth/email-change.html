<!DOCTYPE html>
<html lang="en">
<head th:replace="~{_fragments/head}"></head>
<body bgcolor="#2C2530">

<th:block th:replace="~{_fragments/preheader}"></th:block>
<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F9F6F5">
    <tr>
        <td class="email-content" bgcolor="#F9F6F5">
            <p>We received a request to move your Almonium account to
                <strong><span th:text="${recipientEmail}"></span></strong>.</p>
            <p>Your current sign-in keeps working until you confirm.</p>

            <div class="button-p">
                <table role="presentation" class="button-table" cellpadding="0" cellspacing="0" border="0" align="center">
                    <tr>
                        <td class="button-cell" bgcolor="#5A1A74" align="center">
                            <a th:href="${url}" class="button">Verify and update email</a>
                        </td>
                    </tr>
                </table>
            </div>

            <p>If the button doesn't work, paste this link into your browser:</p>
            <p><a th:href="${url}"><span th:text="${displayUrl}"></span></a></p>

            <div class="rule">
                <p class="muted">If you didn't make this request, ignore this email. Nothing changes.</p>
            </div>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
