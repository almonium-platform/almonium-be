<!DOCTYPE html>
<html lang="en">
<body>

<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center">
    <tr>
        <td class="email-content">
            <p>Hello @<span th:text="${username}"></span>,</p>

            <p><strong>@<span th:text="${counterpartUsername}"></span></strong> would like to connect with you on
                Almonium.</p>

            <div class="button-p">
                <table role="presentation" class="button-table" cellpadding="0" cellspacing="0" border="0" align="center">
                    <tr>
                        <td class="button-cell" bgcolor="#5A1A74" align="center">
                            <a th:href="${url}" class="button">View @<span th:text="${counterpartUsername}"></span>'s profile</a>
                        </td>
                    </tr>
                </table>
            </div>

            <p class="muted">You can accept, ignore, or hide your profile entirely — ignoring sends no notification.</p>

            <div class="rule">
                <p class="muted">Don't want these? Turn off social notifications in Settings.</p>
            </div>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
