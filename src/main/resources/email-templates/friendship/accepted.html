<!DOCTYPE html>
<html lang="en">
<body>

<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center">
    <tr>
        <td class="email-content">
            <p>Hello @<span th:text="${username}"></span>,</p>

            <p class="email-headline"><strong>@<span th:text="${counterpartUsername}"></span> accepted your connection
                request.</strong></p>

            <p class="muted">Accepted on <span th:text="${occurredAt}"></span></p>

            <div class="button-p">
                <table role="presentation" class="button-table" cellpadding="0" cellspacing="0" border="0" align="center">
                    <tr>
                        <td class="button-cell" bgcolor="#5A1A74" align="center">
                            <a th:href="${url}" class="button">Open your friends list</a>
                        </td>
                    </tr>
                </table>
            </div>

        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
