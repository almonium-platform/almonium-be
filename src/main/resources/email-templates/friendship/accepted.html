<!DOCTYPE html>
<html lang="en">
<head th:replace="~{_fragments/head}"></head>
<body bgcolor="#2C2530">

<th:block th:replace="~{_fragments/preheader}"></th:block>
<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F9F6F5">
    <tr>
        <td class="email-content" bgcolor="#F9F6F5">
            <p class="email-headline"><strong>@<span th:text="${counterpartUsername}"></span></strong> accepted your
                connection request.</p>

            <div th:replace="~{_fragments/button :: button(${url}, 'View profile', 152, false)}"></div>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
