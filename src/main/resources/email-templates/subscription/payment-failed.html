<!DOCTYPE html>
<html lang="en">
<head th:replace="~{_fragments/head}"></head>
<body bgcolor="#2C2530">

<th:block th:replace="~{_fragments/preheader}"></th:block>
<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F9F6F5">
    <tr>
        <td class="email-content" bgcolor="#F9F6F5">
            <p>We couldn't process the payment for your <strong><span
                    th:text="${#strings.capitalize(#strings.toLowerCase(planName))}"></span></strong> subscription.</p>

            <p>Your premium access is still active. Update your payment method to prevent an interruption.</p>

            <div th:replace="~{_fragments/button :: button(${url}, 'Update payment details', 228, false)}"></div>

            <div class="rule">
                <p class="muted">If the payment keeps failing, the subscription ends and premium access stops. Your
                    saved words stay.</p>
            </div>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
