<!DOCTYPE html>
<html lang="en">
<head th:replace="~{_fragments/head}"></head>
<body bgcolor="#2C2530">

<th:block th:replace="~{_fragments/preheader}"></th:block>
<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F9F6F5">
    <tr>
        <td class="email-content" bgcolor="#F9F6F5">
            <p>Your <strong><span th:text="${#strings.capitalize(#strings.toLowerCase(planName))}"></span></strong>
                subscription has ended, so premium access is off.</p>

            <p>Level-adapted editions and private imports are closed. Your saved words, decks and progress are kept.</p>

            <div class="button-p">
                <table role="presentation" class="button-table" cellpadding="0" cellspacing="0" border="0" align="center">
                    <tr>
                        <td class="premium-cell" bgcolor="#5A1A74" align="center">
                            <a th:href="${url}" class="premium-btn">Upgrade now</a>
                        </td>
                    </tr>
                </table>
            </div>

            <p class="muted">You can upgrade again whenever you're ready.</p>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
