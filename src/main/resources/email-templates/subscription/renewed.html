<!DOCTYPE html>
<html lang="en">
<body>

<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center">
    <tr>
        <td class="email-content">
            <p>Hello <strong>@<span th:text="${username}"></span></strong>,</p>

            <p>Your <strong><span th:text="${#strings.capitalize(#strings.toLowerCase(planName))}"></span></strong>
                subscription is active again.</p>

            <div class="button-p">
                <table role="presentation" class="button-table" cellpadding="0" cellspacing="0" border="0" align="center">
                    <tr>
                        <td class="premium-cell" bgcolor="#5A1A74" align="center">
                            <a th:href="${url}" class="premium-btn">Open Almonium</a>
                        </td>
                    </tr>
                </table>
            </div>

            <p>Unlimited languages, private imports, and the full library are open to you again.</p>

            <div class="rule">
                <p class="muted">Billing, payment method, and cancellation all live in Settings.</p>
            </div>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
