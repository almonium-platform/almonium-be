<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>

<th:block th:replace="~{_fragments/preheader}"></th:block>
<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center">
    <tr>
        <td class="email-content">
            <p>Your <strong><span th:text="${#strings.capitalize(#strings.toLowerCase(planName))}"></span></strong>
                subscription has renewed. Nothing to do.</p>

            <table role="presentation" class="plan-panel" width="100%" cellpadding="0" cellspacing="0" border="0" th:if="${periodEndDate}">
                <tr>
                    <td class="plan-panel-cell">
                        <p class="plan-label">Next renewal</p>
                        <p class="plan-name"><span th:text="${periodEndDate}"></span></p>
                        <p class="plan-detail"><span th:text="${#strings.capitalize(#strings.toLowerCase(planName))}"></span>
                            membership</p>
                    </td>
                </tr>
            </table>

            <div class="button-p">
                <table role="presentation" class="button-table" cellpadding="0" cellspacing="0" border="0" align="center">
                    <tr>
                        <td class="premium-cell" bgcolor="#5A1A74" align="center">
                            <a th:href="${url}" class="premium-btn">Open Almonium</a>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="rule">
                <p class="muted">Billing, payment method, and cancellation all live in
                    <a th:href="${settingsUrl}">Settings</a>.</p>
            </div>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
