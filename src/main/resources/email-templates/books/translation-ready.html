<!DOCTYPE html>
<html lang="en">
<head th:replace="~{_fragments/head}"></head>
<body bgcolor="#2C2530">

<th:block th:replace="~{_fragments/preheader}"></th:block>
<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F9F6F5">
    <tr>
        <td class="email-content" bgcolor="#F9F6F5">
            <p class="muted">The book you asked for</p>
            <p class="email-headline"><em th:text="${bookTitle}"></em> now reads alongside
                <span th:text="${languageName}"></span>.</p>
            <p>You asked for this one in <span th:text="${month}"></span>. Every chapter is aligned, and every reader
                of the pair has it from today.</p>

            <div th:replace="~{_fragments/button :: button(${url}, 'Open chapter one', 190, false)}"></div>

            <!--/* The allowance line sits under a hairline, apart from the news; a plan with no limit has no line. */-->
            <p class="closing-line" th:if="${!#strings.isEmpty(requestsLeft)}" th:text="${requestsLeft}"></p>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
