<!DOCTYPE html>
<html lang="en">
<head th:replace="~{_fragments/head}"></head>
<body bgcolor="#2C2530">

<th:block th:replace="~{_fragments/preheader}"></th:block>
<header th:replace="~{_fragments/header}"></header>

<table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F9F6F5">
    <tr>
        <td class="email-content" bgcolor="#F9F6F5">
            <p class="muted">The book you suggested</p>
            <p class="email-headline"><em th:text="${bookTitle}"></em> is now in the library.</p>
            <p>You suggested this one in <span th:text="${month}"></span>. The library copy can be read alongside a
                translation, and you can ask for more languages from its page. Your private copy stays yours, with
                its own progress.</p>

            <div th:replace="~{_fragments/button :: button(${url}, 'Open the library copy', 220, false)}"></div>
        </td>
    </tr>
</table>

<th:block th:replace="~{_fragments/footer}"></th:block>

</body>
</html>
