<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        p {
            margin: 10px 0;
        }

        body {
            color: #33292E;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 18px;
            background-color: #2C2530;
            line-height: 1.55;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .email-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 1em;
            background-color: #F9F6F5;
            border-radius: 30px;
        }

        .email-content {
            padding: 0 1em;
        }

        .header {
            text-align: center;
            font-size: 12px;
            color: #ffffff;
            background-color: #2C2530;
            margin: 3em 0 2em 0;
            padding: 3em 0 1em 0;
        }

        .header-wordmark {
            width: 168px;
            height: auto;
            vertical-align: middle;
        }

        .header p {
            display: inline;
            margin-left: 10px;
            font-size: 40px;
            color: #ffffff;
            vertical-align: middle;
        }

        .button-p {
            text-align: center;
            margin: 40px 0;
        }

        .button {
            color: #ffffff;
            background: #5A1A74;
            display: inline-block;
            padding: 16px 20px;
            font-size: 16px;
            text-decoration: none;
            font-family: Georgia, "Times New Roman", serif;
            font-weight: bold;
            border-radius: 50px;
            margin: 0 auto;
        }

        .premium-btn {
            color: #ffffff;
            background: linear-gradient(135deg, #8F2356, #5A1A74);
            display: inline-block;
            padding: 16px 20px;
            font-size: 16px;
            text-decoration: none;
            font-family: Georgia, "Times New Roman", serif;
            font-weight: bold;
            border-radius: 50px;
            margin: 0 auto;
        }

        .footer {
            text-align: center;
            font-size: 15px;
            background-color: #2C2530;
            margin-top: 2em;
            padding: 10px;
        }

        .footer img {
            width: 50px;
            height: auto;
            vertical-align: middle;
        }

        .footer p {
            display: inline;
            margin-left: 10px;
            color: #a3a3a3;
            vertical-align: middle;
        }    </style>
    <title></title>
</head>
</html>
